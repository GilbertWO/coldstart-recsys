spring.application.name=recs-api

spring.datasource.url=jdbc:postgresql://localhost:5432/coldstart
spring.datasource.username=coldstart
spring.datasource.password=${POSTGRES_PASSWORD}

spring.data.redis.host=localhost
spring.data.redis.port=6379
server.port=8081

management.endpoint.health.show-details=always

spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=100ms

# Redis list cache: off by default because the same-session A/B (README, October 17) showed no gain on
# skewed traffic. Turn it on with recs.list-cache-enabled=true; the Redis health check follows the same switch.
recs.list-cache-enabled=false
management.health.redis.enabled=${recs.list-cache-enabled}
